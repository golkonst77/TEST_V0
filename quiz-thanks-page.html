<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо за прохождение квиза</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 448px;
            width: 100%;
            padding: 32px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .close-button {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .close-button:hover {
            color: #374151;
        }

        .close-button svg {
            width: 24px;
            height: 24px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #15803d;
        }

        .message {
            font-size: 1rem;
            color: #374151;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .coupon-container {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            width: 100%;
        }

        .coupon-label {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .coupon-code {
            font-size: 1.125rem;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            color: #7c3aed;
            margin-bottom: 4px;
            user-select: all;
            word-break: break-all;
        }

        .copy-button {
            background: white;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .copy-button:hover {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        .close-button-main {
            margin-top: 8px;
            background: #22c55e;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .close-button-main:hover {
            background: #16a34a;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>
    <!-- Модальное окно благодарности -->
    <div class="modal-overlay">
        <div class="modal-content">
            <h1 class="sr-only">Благодарность за прохождение квиза</h1>
            <p class="sr-only">Ваш купон сохранен, мы свяжемся с вами</p>
            
            <button class="close-button" onclick="closeModal()" aria-label="Закрыть">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <h2>Спасибо за уделенное время!</h2>
            
            <p class="message">
                Ваш купон сохранен! Сообщение отправлено в WhatsApp.<br/>
                Мы свяжемся с вами в ближайшее время!<br/>
                Хорошего дня!
            </p>

            <!-- Блок с купоном -->
            <div class="coupon-container">
                <div class="coupon-label">Ваш купон на скидку:</div>
                <div class="coupon-code" id="couponCode">PROSTOBURO-XXXXXX-10000</div>
                <button class="copy-button" onclick="copyCoupon()">Скопировать</button>
            </div>

            <button class="close-button-main" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        // Функция копирования купона в буфер обмена
        function copyCoupon() {
            const couponCode = document.getElementById('couponCode').textContent;
            navigator.clipboard.writeText(couponCode).then(() => {
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = 'Скопировано!';
                button.style.background = '#22c55e';
                button.style.color = 'white';
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.background = 'white';
                    button.style.color = '#374151';
                }, 2000);
            }).catch(err => {
                console.error('Ошибка копирования:', err);
                alert('Не удалось скопировать купон. Скопируйте вручную: ' + couponCode);
            });
        }

        // Функция закрытия модального окна
        function closeModal() {
            document.querySelector('.modal-overlay').style.display = 'none';
        }

        // Закрытие по клику вне модального окна
        document.querySelector('.modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Закрытие по нажатию Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
