<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест отправки на Yandex</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>🧪 Тест отправки email на Yandex</h1>
    
    <div>
        <button onclick="checkSettings()">1. Проверить настройки</button>
        <button onclick="sendTestEmail()">2. Отправить тестовое письмо</button>
    </div>
    
    <div id="result"></div>

    <script>
        async function checkSettings() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Проверяю настройки...';
            resultDiv.className = '';
            
            try {
                const response = await fetch('/api/test-yandex-email');
                const data = await response.json();
                
                resultDiv.className = data.success ? 'success' : 'error';
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = 'Ошибка: ' + error.message;
            }
        }

        async function sendTestEmail() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Отправляю тестовое письмо...';
            resultDiv.className = '';
            
            try {
                const response = await fetch('/api/test-yandex-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: 'golkonst@yandex.ru'
                    })
                });
                
                const data = await response.json();
                
                resultDiv.className = data.success ? 'success' : 'error';
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = 'Ошибка: ' + error.message;
            }
        }
    </script>
</body>
</html>
